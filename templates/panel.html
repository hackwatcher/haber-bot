<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haber Paneli</title>
<style>
  :root { --bg:#0e1117; --kart:#171b23; --cizgi:#262c37; --yazi:#e8ebf0; --soluk:#8b94a3; --kirmizi:#e61e2a; --yesil:#2bb673; --sari:#f2b705; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--yazi); font:15px/1.45 system-ui, "Segoe UI", sans-serif; }
  header { position:sticky; top:0; z-index:5; background:#0b0e13; border-bottom:1px solid var(--cizgi); padding:12px 16px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
  h1 { font-size:18px; margin:0 12px 0 0; }
  .rozet { padding:3px 9px; border-radius:6px; font-size:12px; font-weight:700; }
  .deneme { background:var(--sari); color:#000; }
  button { font:inherit; border:0; border-radius:7px; padding:7px 13px; cursor:pointer; background:#2a313d; color:var(--yazi); }
  button:hover { filter:brightness(1.2); }
  button.ana { background:var(--kirmizi); color:#fff; font-weight:700; }
  button.emin { background:var(--sari); color:#000; font-weight:700; }
  .anahtar { display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none; }
  .anahtar i { width:44px; height:24px; border-radius:12px; background:#3a4250; position:relative; transition:.2s; }
  .anahtar i::after { content:""; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:#fff; transition:.2s; }
  .anahtar.acik i { background:var(--yesil); } .anahtar.acik i::after { left:23px; }
  .bilgi { color:var(--soluk); font-size:13px; }
  .filtre { display:flex; gap:6px; flex-wrap:wrap; }
  .filtre button.sec { background:var(--yazi); color:#000; }
  main { display:grid; grid-template-columns:1fr 340px; gap:16px; padding:16px; max-width:1400px; margin:auto; }
  @media (max-width:900px) { main { grid-template-columns:1fr; } }
  .haber { background:var(--kart); border:1px solid var(--cizgi); border-radius:10px; padding:12px 14px; margin-bottom:10px; display:flex; gap:12px; }
  .haber.paylasildi { opacity:.45; } .haber.engelli, .haber.gizli { opacity:.35; }
  .haber .govde { flex:1; min-width:0; }
  .ust { display:flex; gap:8px; align-items:center; font-size:12px; color:var(--soluk); margin-bottom:3px; flex-wrap:wrap; }
  .kaynak { font-weight:700; color:var(--yazi); }
  .yildiz { color:var(--sari); font-weight:700; }
  .baslik { font-weight:700; font-size:16px; }
  .ozet { color:var(--soluk); font-size:13px; margin-top:3px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .dugmeler { display:flex; flex-direction:column; gap:6px; }
  .durum { font-size:12px; font-weight:700; }
  .kayit { background:var(--kart); border:1px solid var(--cizgi); border-radius:10px; padding:12px; font:12px/1.5 ui-monospace, Consolas, monospace; color:var(--soluk); position:sticky; top:80px; max-height:80vh; overflow:auto; white-space:pre-wrap; }
  a { color:inherit; }
  dialog { background:var(--kart); color:var(--yazi); border:1px solid var(--cizgi); border-radius:12px; padding:18px; width:min(960px, 96vw); }
  dialog::backdrop { background:#000a; }
  .duzen { display:grid; grid-template-columns:1fr; gap:16px; margin-bottom:12px; }
  @media (max-width:800px) { .duzen { grid-template-columns:1fr; } }
  textarea { width:100%; background:#0e1117; color:var(--yazi); border:1px solid var(--cizgi); border-radius:8px; padding:10px; font:inherit; resize:vertical; }
  .slaytlar { display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; }
  .slaytlar img { width:260px; flex:none; border-radius:8px; border:1px solid var(--cizgi); }
  .slaytlar p { color:var(--soluk); }
</style>
</head>
<body>
<header>
  <h1>Haber Paneli</h1>
  <span class="rozet" style="background:#2bb673;color:#000;font-weight:700;">CANLI İZLEME · Yalnızca Tıklayınca Paylaşır</span>
  <span class="bilgi" id="sayac"></span>
  <span style="flex:1"></span>
  <div class="filtre" id="filtre">
    <button data-f="hepsi" class="sec">Hepsi</button>
    <button data-f="oncelikli">★ Öncelikli</button>
    <button data-f="yeni">Paylaşılmamış</button>
  </div>
  <button id="yenile">↻ Yenile</button>
</header>
<main>
  <section id="liste"></section>
  <aside class="kayit" id="kayit"></aside>
</main>

<dialog id="dlg">
  <div class="duzen">
    <div>
      <div class="ust" id="dKaynak"></div>
      <label class="bilgi">Kanca</label>
      <textarea id="dKanca" rows="1"></textarea>
      <label class="bilgi">Başlık</label>
      <textarea id="dBaslik" rows="3"></textarea>
      <label class="bilgi">Özet (açıklamaya girer)</label>
      <textarea id="dOzet" rows="4"></textarea>
      <div style="display:flex; gap:8px; margin-top:12px">
        <button id="dOnizle">Önizlemeyi güncelle</button>
        <span style="flex:1"></span>
        <button onclick="dlg.close()">Vazgeç</button>
        <button class="ana" id="dPaylas">Paylaş</button>
      </div>
    </div>
  </div>
  <div class="slaytlar" id="dSlaytlar"></div>
</dialog>

<script>
let veri = {haberler: []}, filtre = "hepsi", acik = null;
const $ = s => document.querySelector(s);
const saat = z => new Date(z).toLocaleTimeString("tr-TR", {hour: "2-digit", minute: "2-digit"});
const esc = s => (s || "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const post = (u, b) => fetch(u, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(b || {})});

async function yukle() {
  veri = await (await fetch("/api/durum")).json();
  if ($("#deneme")) $("#deneme").hidden = !veri.deneme;
  if ($("#oto")) $("#oto").classList.toggle("acik", veri.otomatik);
  $("#sayac").textContent = `Bugün ${veri.bugun}/${veri.gunluk_en_fazla} paylaşım (GitHub Actions otomatik · Panel manuel)`;
  $("#kayit").textContent = veri.kayit.join("\n");
  ciz();
}

function ciz() {
  let l = veri.haberler;
  if (filtre === "oncelikli") l = l.filter(h => h.oncelikli);
  if (filtre === "yeni") l = l.filter(h => h.durum === "yeni" || h.durum === "hata");
  $("#liste").innerHTML = l.map(h => {
    const diger = (h.diger_kaynaklar || []).length ? ` +${h.diger_kaynaklar.join(", ")}` : "";
    const durum = {paylasildi: `<span class="durum" style="color:var(--yesil)">✓ Paylaşıldı ${saat(h.paylasildi)}</span>`,
                   engelli: `<span class="durum">Engelli kelime</span>`, gizli: `<span class="durum">Gizlendi</span>`,
                   hata: `<span class="durum" style="color:var(--kirmizi)" title="${esc(h.hata)}">Hata</span>`}[h.durum] || "";
    const dugme = h.durum === "paylasildi" ? "" :
      `<button class="ana" data-paylas="${h.id}">Paylaş</button><button data-duzenle="${h.id}">Düzenle</button><button data-gizle="${h.id}">Gizle</button>`;
    return `<div class="haber ${h.durum}">
      <div class="govde">
        <div class="ust">${h.oncelikli ? '<span class="yildiz">★</span>' : ""}<span class="kaynak">${esc(h.kaynak)}${esc(diger)}</span><span>${saat(h.zaman)}</span>${durum}<a href="${esc(h.link)}" target="_blank">kaynağa git ↗</a></div>
        <div class="baslik">${esc(h.baslik)}</div>
        ${h.ozet ? `<div class="ozet">${esc(h.ozet)}</div>` : ""}
      </div>
      <div class="dugmeler">${dugme}</div>
    </div>`;
  }).join("") || '<p class="bilgi">Haber yok.</p>';
}

async function paylas(id, duzen) {
  const r = await post(`/api/paylas/${id}`, duzen);
  const j = await r.json();
  if (!j.ok) alert("Paylaşılamadı: " + j.hata);
  yukle();
}

$("#liste").addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.paylas) {
    if (!b.classList.contains("emin")) {  // yanlış tıklamaya karşı ikinci tık
      b.classList.add("emin"); b.textContent = "Emin misin?";
      setTimeout(() => { b.classList.remove("emin"); b.textContent = "Paylaş"; }, 3000);
      return;
    }
    b.disabled = true; b.textContent = "Gönderiliyor…";
    paylas(b.dataset.paylas);
  }
  if (b.dataset.gizle) { await post(`/api/gizle/${b.dataset.gizle}`); yukle(); }
  if (b.dataset.duzenle) {
    acik = veri.haberler.find(h => h.id === b.dataset.duzenle);
    $("#dKaynak").textContent = `${acik.kaynak} · ${saat(acik.zaman)}`;
    $("#dKanca").value = ""; $("#dBaslik").value = ""; $("#dOzet").value = "";
    $("#dlg").showModal(); onizle();
  }
});

const duzen = () => ({kanca: $("#dKanca").value, baslik: $("#dBaslik").value, ozet: $("#dOzet").value});
async function onizle() {
  $("#dSlaytlar").innerHTML = "<p>Haber okunuyor, slaytlar hazırlanıyor…</p>";
  const j = await (await post(`/api/onizle/${acik.id}`, duzen())).json();
  if (!$("#dKanca").value) $("#dKanca").value = j.kanca;
  if (!$("#dBaslik").value) $("#dBaslik").value = j.baslik;
  $("#dSlaytlar").innerHTML = j.slaytlar.map(u => `<img src="${u}" alt="Slayt">`).join("");
}
$("#dOnizle").onclick = onizle;
$("#dPaylas").onclick = async () => {
  $("#dPaylas").disabled = true; $("#dPaylas").textContent = "Gönderiliyor…";
  await paylas(acik.id, duzen());
  $("#dPaylas").disabled = false; $("#dPaylas").textContent = "Paylaş"; $("#dlg").close();
};

if ($("#oto")) {
  $("#oto").onclick = async () => {
    const yeni = !veri.otomatik;
    if (yeni && !confirm("Otomatik paylaşım açılsın mı? Bot yeni haberleri kendisi paylaşacak.")) return;
    await post("/api/otomatik", {acik: yeni}); yukle();
  };
}
$("#yenile").onclick = async () => { $("#yenile").textContent = "…"; await post("/api/yenile"); $("#yenile").textContent = "↻ Yenile"; yukle(); };
$("#filtre").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  filtre = b.dataset.f; document.querySelectorAll("#filtre button").forEach(x => x.classList.toggle("sec", x === b)); ciz();
};

yukle(); setInterval(yukle, 15000);
</script>
</body>
</html>
